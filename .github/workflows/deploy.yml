name: Deploy Backend to Azure VM

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, Push to ACR and Deploy to Azure VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry (ACR)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_REGISTRY || secrets.AZURE_ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME || secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD || secrets.AZURE_ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Docker Image
        run: |
          ACR_SERVER="${{ secrets.AZURE_REGISTRY || secrets.AZURE_ACR_LOGIN_SERVER }}"
          IMAGE_TAG="${{ github.sha }}"
          
          docker build \
            -t ${ACR_SERVER}/meshvi-backend:${IMAGE_TAG} \
            -t ${ACR_SERVER}/meshvi-backend:latest \
            -f apps/backend/Dockerfile .
            
          docker push ${ACR_SERVER}/meshvi-backend:${IMAGE_TAG}
          docker push ${ACR_SERVER}/meshvi-backend:latest

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER || 'azureuser' }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            ACR_SERVER="${{ secrets.AZURE_REGISTRY || secrets.AZURE_ACR_LOGIN_SERVER }}"
            ACR_USER="${{ secrets.ACR_USERNAME || secrets.AZURE_ACR_USERNAME }}"
            ACR_PASS="${{ secrets.ACR_PASSWORD || secrets.AZURE_ACR_PASSWORD }}"
            
            echo "==== Logging into ACR on VM ===="
            echo "$ACR_PASS" | sudo docker login $ACR_SERVER -u $ACR_USER --password-stdin

            echo "==== Pulling latest backend image ===="
            sudo docker pull ${ACR_SERVER}/meshvi-backend:latest

            echo "==== Ensuring persistent data directory exists ===="
            mkdir -p /home/${{ secrets.VM_USER || 'azureuser' }}/meshvi-data/uploads

            echo "==== Stopping previous container ===="
            sudo docker stop meshvi-backend || true
            sudo docker rm meshvi-backend || true

            echo "==== Running updated backend container on VM ===="
            sudo docker run -d \
              --name meshvi-backend \
              -p 3500:3500 \
              -p 80:3500 \
              --restart unless-stopped \
              -v /home/${{ secrets.VM_USER || 'azureuser' }}/meshvi-data/uploads:/app/apps/backend/uploads \
              -e NODE_ENV=production \
              -e PORT=3500 \
              -e DATABASE_URL="${{ secrets.PRODUCTION_DATABASE_URL }}" \
              -e FRONTEND_URL="https://meshvi.org" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET || 'meshvi_prod_secret_jwt_key_2026_azure_vm_secure!' }}" \
              -e GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              -e GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              -e GOOGLE_REDIRECT_URI="https://meshvi.org/auth/google/callback" \
              -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
              -e AI_PRIMARY_PROVIDER="gemini" \
              -e GEMINI_MODEL="gemini-2.5-flash" \
              ${ACR_SERVER}/meshvi-backend:latest

            echo "==== Cleaning up unused images ===="
            sudo docker image prune -f

            echo "==== Verifying running container ===="
            sudo docker ps --filter "name=meshvi-backend"
