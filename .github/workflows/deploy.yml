name: Deploy Backend to Azure VM

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, Push to ACR and Deploy to Azure VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry (ACR)
        uses: docker/login-action@v3
        with:
          registry: meshviacr5435.azurecr.io
          username: meshviacr5435
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            meshviacr5435.azurecr.io/meshvi-backend:${{ github.sha }}
            meshviacr5435.azurecr.io/meshvi-backend:latest

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 20.212.196.191
          username: azureuser
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            ACR_SERVER="meshviacr5435.azurecr.io"
            ACR_USER="meshviacr5435"
            ACR_PASS="${{ secrets.ACR_PASSWORD }}"

            echo "==== 1. Installing Caddy for Automatic HTTPS SSL ===="
            if ! command -v caddy &> /dev/null; then
              sudo apt-get update -y
              sudo apt-get install -y debian-keyring debian-archive-keyring apt-transport-https curl
              curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg --yes || true
              curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | sudo tee /etc/apt/sources.list.d/caddy-stable.list
              sudo apt-get update -y
              sudo apt-get install -y caddy
            fi

            echo "==== 2. Logging into ACR on VM ===="
            echo "$ACR_PASS" | sudo docker login $ACR_SERVER -u $ACR_USER --password-stdin

            echo "==== 3. Pulling latest backend image ===="
            sudo docker pull $ACR_SERVER/meshvi-backend:latest

            echo "==== 4. Ensuring persistent data directory exists ===="
            mkdir -p /home/azureuser/meshvi-data/uploads

            echo "==== 5. Stopping previous container ===="
            sudo docker stop meshvi-backend 2>/dev/null || true
            sudo docker rm meshvi-backend 2>/dev/null || true

            echo "==== 6. Configuring Caddyfile for SSL reverse proxy ===="
            sudo bash -c 'printf "api.meshvi.org {\n    reverse_proxy 127.0.0.1:3500\n}\n\nmeshvi.org {\n    redir https://www.meshvi.org{uri} permanent\n}\n" > /etc/caddy/Caddyfile'

            echo "==== 7. Restarting Caddy with Automatic SSL ===="
            sudo systemctl enable caddy
            sudo systemctl restart caddy

            echo "==== 8. Generating environment file for backend ===="
            cat << 'ENVEOF' > /home/azureuser/meshvi.env
NODE_ENV=production
PORT=3500
DATABASE_URL=${{ secrets.PRODUCTION_DATABASE_URL }}
FRONTEND_URL=https://meshvi.org
JWT_SECRET=${{ secrets.JWT_SECRET || 'meshvi_prod_secret_jwt_key_2026_azure_vm_secure!' }}
GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
GOOGLE_REDIRECT_URI=https://meshvi.org/auth/google/callback
GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
AI_PRIMARY_PROVIDER=gemini
GEMINI_MODEL=gemini-2.5-flash
EMAIL_PROVIDER=${{ secrets.EMAIL_PROVIDER || 'smtp' }}
SMTP_HOST=${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
SMTP_PORT=${{ secrets.SMTP_PORT || '587' }}
SMTP_SECURE=${{ secrets.SMTP_SECURE || 'false' }}
SMTP_USER=${{ secrets.SMTP_USER || 'meshviconnect@gmail.com' }}
SMTP_PASS=${{ secrets.SMTP_PASS || 'svjwanaigzxsrjkb' }}
EMAIL_FROM_ADDRESS=${{ secrets.EMAIL_FROM_ADDRESS || 'meshviconnect@gmail.com' }}
ENVEOF
            chmod 600 /home/azureuser/meshvi.env

            echo "==== 9. Running updated backend container on VM on port 3500 ===="
            sudo docker run -d \
              --name meshvi-backend \
              -p 127.0.0.1:3500:3500 \
              --restart unless-stopped \
              -v /home/azureuser/meshvi-data/uploads:/app/apps/backend/uploads \
              --env-file /home/azureuser/meshvi.env \
              $ACR_SERVER/meshvi-backend:latest

            echo "==== 10. Verifying running container and Caddy ===="
            sudo docker ps --filter "name=meshvi-backend"
            sudo systemctl status caddy --no-pager || true
