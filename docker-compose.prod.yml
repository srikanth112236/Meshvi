version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Enterprise Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: setu_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-setu_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SetuSecurePass2026!}
      POSTGRES_DB: ${POSTGRES_DB:-project_setu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-setu_admin} -d ${POSTGRES_DB:-project_setu}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Backend NestJS API Service (Port 3500)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: setu_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3500
      DATABASE_URL: postgresql://${POSTGRES_USER:-setu_admin}:${POSTGRES_PASSWORD:-SetuSecurePass2026!}@postgres:5432/${POSTGRES_DB:-project_setu}?schema=project_setu&sslmode=prefer
      FRONTEND_URL: https://meshvi.org
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: https://meshvi.org/auth/google/callback
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "3500:3500"
    volumes:
      - backend_uploads:/app/apps/backend/uploads

  # ----------------------------------------------------------------------------
  # Frontend Web Client (Vite + Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: https://api.meshvi.org/api/v1
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    container_name: setu_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  backend_uploads:
